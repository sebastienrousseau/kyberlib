[package]
name = "kyberlib-hybrid"
description = "Hybrid post-quantum key exchange over kyberlib: the X25519MLKEM768, SecP256r1MLKEM768 and SecP384r1MLKEM1024 TLS groups and the X-Wing KEM."
documentation = "https://docs.rs/kyberlib-hybrid"
readme = "README.md"
categories = ["algorithms", "cryptography", "no-std"]
keywords = ["ml-kem", "x-wing", "hybrid", "post-quantum", "tls"]
publish = false   # Phase 5.1 lands the implementation; flips publishable post-audit (#177).

include = [
    "/CHANGELOG.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/Cargo.toml",
    "/README.md",
    "/src/**",
    "/tests/*.rs",
]

authors.workspace      = true
edition.workspace      = true
homepage.workspace     = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
version.workspace      = true

[lib]
name = "kyberlib_hybrid"
path = "src/lib.rs"
crate-type = ["rlib"]

[features]
default = ["x25519", "xwing"]
# Per-share enable. All three hybrids will eventually be on-demand.
x25519       = ["dep:x25519-dalek"]
# X-Wing general-purpose KEM (draft-connolly-cfrg-xwing-kem).
xwing        = ["dep:x25519-dalek", "dep:sha3"]
secp256r1    = ["dep:p256", "dep:crypto-bigint"]
secp384r1    = ["dep:p384", "dep:crypto-bigint"]

[dependencies]
# `version` is set explicitly even though the path-resolution is what
# the workspace build uses — `cargo deny`'s wildcards check rejects
# unversioned path deps, and `cargo publish` requires the version
# stamp to be present on the manifest.
kyberlib = { path = "../kyberlib", version = "0.0.15", default-features = false, features = ["kyber768"] }
# X25519 classical KEM. Activated only when the `x25519` feature is on.
x25519-dalek = { workspace = true, optional = true }
# SHAKE256 / SHA3-256 for X-Wing key expansion and its combiner.
sha3         = { workspace = true, optional = true }
# NIST curves for the SecP*MLKEM TLS hybrids.
p256         = { workspace = true, optional = true }
p384         = { workspace = true, optional = true }
# Constraint only (RUSTSEC-2026-0387): no crypto-bigint below 0.7.6 may
# resolve under the curve features. Listed in cargo-machete's ignore
# set below because no code names it.
crypto-bigint = { workspace = true, optional = true }
rand_core    = { workspace = true }
zeroize      = { workspace = true }

[dev-dependencies]
rand = { workspace = true, features = ["std", "std_rng", "getrandom"] }
rand_chacha = { workspace = true }

[lints]
workspace = true

[package.metadata.cargo-machete]
# crypto-bigint is a version floor for a security advisory, not an import.
ignored = ["crypto-bigint"]

[package.metadata.docs.rs]
features     = ["x25519"]
rustdoc-args = ["--cfg", "docsrs"]
